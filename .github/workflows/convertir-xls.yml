name: Convertir Excel antiguos (.xls) a .xlsx

# El lector del Worker no saca datos de un .xls (formato binario antiguo).
# Aquí LibreOffice lo convierte a .xlsx y la copia se sube como archivo
# derivado, que se lee por la ingesta de siempre. La app lo dispara al
# recibir un .xls; el cron es la red de seguridad. Simula por defecto en
# ejecución manual.

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      file_id:
        description: "ID exacto del expediente (vacío = todos los .xls pendientes)"
        required: false
        default: ""
        type: string
      aplicar:
        description: "Subir la copia convertida (1) o sólo convertir y medir (0)"
        required: false
        default: "0"
        type: string

permissions:
  issues: write

jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instalar LibreOffice Calc
        run: command -v soffice || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc)
      - name: Convertir y (opcional) subir
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILE_ID: ${{ inputs.file_id }}
          APLICAR: ${{ github.event_name == 'schedule' && '1' || inputs.aplicar }}
        run: node scripts/convertir-xls.mjs
      - name: Avisar si falló
        if: failure()
        uses: ./.github/actions/avisar-fallo-cron
        with:
          workflow-name: "Convertir Excel antiguos (.xls) a .xlsx"

concurrency:
  group: convertir-xls-produccion
  cancel-in-progress: false
