name: Comprobar cargas recientes

# Informe de qué archivos se han subido al Centro de Control y si sus datos
# entraron en el panel. Se lanza a mano cuando alguien pregunta "¿se subió
# bien?", y responde con el estado real de producción.
#
# Vive en Actions porque el runner sí tiene salida a producción y ya dispone de
# las credenciales de verificación; una sesión de trabajo puede no tenerlas.

on:
  workflow_dispatch:
    inputs:
      horas:
        description: "Cuántas horas hacia atrás mirar"
        required: false
        default: "24"
        type: string
      detalle:
        description: "Volcar el contenido de las propuestas (1) o la estructura del plan de Project (project)"
        required: false
        default: "0"
        type: string
      plan:
        description: "Con detalle=project: texto del nombre del plan a mostrar y niveles (p. ej. urbanismo fase i|5)"
        required: false
        default: ""
        type: string

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar cargas
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          HORAS: ${{ inputs.horas }}
        run: node scripts/comprobar-cargas.mjs
      - name: Propuestas de sección nueva
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          HORAS: ${{ inputs.horas }}
          DETALLE: ${{ inputs.detalle }}
        run: node scripts/ver-propuestas.mjs
      - name: Diagnóstico de actualización por revisión
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/diagnostico-actualizacion.mjs
      - name: Corregir urbanismo del Informe Ejecutivo de octubre
        # Publica en producción: sólo con detalle=corregir-urbanismo-octubre.
        if: ${{ inputs.detalle == 'corregir-urbanismo-octubre' }}
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/corregir-urbanismo-octubre.mjs
      - name: Historial de urbanismo en D1
        if: ${{ inputs.detalle == 'historial-urbanismo' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/ver-historial-urbanismo.mjs
      - name: Publicaciones sin corte posteriores a la ganadora fechada
        if: ${{ inputs.detalle == 'cortes-vacios' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/ver-cortes-vacios.mjs
      - name: Auditoría del flujo de cargas en D1
        if: ${{ inputs.detalle == 'auditoria-flujo' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/auditar-flujo-cargas.mjs
      - name: Corregir cortes guardados con la regla actual
        # Simula con detalle=migrar-cortes; sólo escribe con migrar-cortes-aplicar.
        if: ${{ inputs.detalle == 'migrar-cortes' || inputs.detalle == 'migrar-cortes-aplicar' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APLICAR: ${{ inputs.detalle == 'migrar-cortes-aplicar' && '1' || '0' }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/migrar-cortes.mjs
      - name: Seguridad y Curva S con su archivo de origen
        if: ${{ inputs.detalle == 'seguridad' }}
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/ver-seguridad-curva.mjs
      - name: Panel en un navegador real (edificios y errores de la página)
        if: ${{ inputs.detalle == 'navegador' }}
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium >/dev/null
          npm install --no-save playwright@1.56.1 >/dev/null
          node scripts/ver-panel-navegador.mjs
      - name: Urbanismo y zonas en la última presentación
        if: ${{ inputs.detalle == 'presentacion' }}
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILTRO: ${{ inputs.plan }}
        run: node scripts/ver-texto-presentacion.mjs
      - name: Estructura del último plan de Project
        if: ${{ inputs.detalle == 'project' }}
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          PLAN: ${{ inputs.plan }}
        run: |
          export FILTRO="${PLAN%%|*}"
          case "$PLAN" in *"|"*) export NIVELES="${PLAN##*|}";; esac
          node scripts/ver-estructura-project.mjs
