name: Comprobar cargas recientes

# Informe de qué archivos se han subido al Centro de Control y si sus datos
# entraron en el panel. Se lanza a mano cuando alguien pregunta "¿se subió
# bien?", y responde con el estado real de producción.
#
# Vive en Actions porque el runner sí tiene salida a producción y ya dispone de
# las credenciales de verificación; una sesión de trabajo puede no tenerlas.

on:
  workflow_dispatch:
    inputs:
      horas:
        description: "Cuántas horas hacia atrás mirar"
        required: false
        default: "24"
        type: string
      detalle:
        description: "Volcar el contenido de las propuestas (1) para modelarlas"
        required: false
        default: "0"
        type: string

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar cargas
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          HORAS: ${{ inputs.horas }}
        run: node scripts/comprobar-cargas.mjs
      - name: Propuestas de sección nueva
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          HORAS: ${{ inputs.horas }}
          DETALLE: ${{ inputs.detalle }}
        run: node scripts/ver-propuestas.mjs
      - name: Diagnóstico de actualización por revisión
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/diagnostico-actualizacion.mjs
