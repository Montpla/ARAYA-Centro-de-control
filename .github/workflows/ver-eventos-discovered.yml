name: Ver eventos y cortes de discoveredSections

# Sólo lectura: para decidir la corrección correcta de la incidencia de
# discoveredSections sin dañar nada más -- qué otras claves llevan los
# eventos que aportan los parches legacy, y el corte real de la fila raíz
# consolidada frente al de esos parches.

on:
  workflow_dispatch: {}

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consultar eventos y cortes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ver-eventos-discovered.mjs
