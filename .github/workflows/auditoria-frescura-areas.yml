name: Auditoría de frescura de datos por área

# Consulta puntual, solo lectura: compara el archivo más reciente integrado
# por área contra el último dato vivo publicado de esa área, y vuelca
# cualquier archivo que haya quedado en un estado de revisión pendiente. Se
# retira tras el diagnóstico.

on:
  workflow_dispatch: {}

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Auditar frescura por área
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/auditoria-frescura-areas.mjs
