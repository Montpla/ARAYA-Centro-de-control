name: Ver conexiones y avisos de presencia

# Sólo lectura: consulta user_presence y los avisos "user_connected" más
# recientes para un correo dado (input "correo"), para diagnosticar avisos
# de conexión repetidos o con plataforma incorrecta.

on:
  workflow_dispatch:
    inputs:
      correo:
        description: "Correo a diagnosticar"
        required: true

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consultar conexiones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORREO: ${{ inputs.correo }}
        run: node scripts/ver-conexiones.mjs
