name: Reintentar verificaciones de cargas

# Red de seguridad de "Verificar carga": lanza la verificación de los archivos
# que nunca llegaron a verificarse y vuelve a lanzar las revisiones de Claude
# que no terminaron (por ejemplo, por el límite de uso de la suscripción).
# Ver scripts/reintentar-verificaciones.mjs.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Lanzar de verdad (1) o sólo listar (0)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: reintentar-verificaciones
  cancel-in-progress: false

jobs:
  reintentar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reintentar
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APLICAR: ${{ github.event_name == 'schedule' && '1' || inputs.aplicar }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/reintentar-verificaciones.mjs
      - name: Avisar si falló
        if: failure()
        uses: ./.github/actions/avisar-fallo-cron
        with:
          workflow-name: "Reintentar verificaciones de cargas"
