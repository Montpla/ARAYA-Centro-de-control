name: Aplicar migración D1

# Aplica UNA migración de drizzle/ contra la base D1 remota, a mano, desde la
# pestaña Actions de GitHub. No se dispara nunca sola.
#
# Por qué existe: las migraciones están deliberadamente fuera del pipeline de
# despliegue (ver HANDOFF.md, "Publicación con Cloudflare Workers"). Esta base
# no usa el sistema de seguimiento de `wrangler d1 migrations`, así que no hay
# forma segura de detectar automáticamente cuáles ya se aplicaron. Aplicarlas
# a mano sigue siendo lo correcto; lo que sobraba era tener que hacerlo desde
# un ordenador con wrangler instalado y credenciales de Cloudflare a mano.
#
# Reutiliza los secretos del repositorio que ya usa deploy.yml
# (CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID): ninguna credencial nueva.
#
# Reintentar una migración ya aplicada falla en voz alta ("table already
# exists"), lo cual es seguro pero ruidoso — no deja la base a medias.

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: "Archivo de drizzle/ a aplicar (p. ej. 0021_tv_device_tokens.sql)"
        required: true
        type: string
      confirmar:
        description: 'Escribe "aplicar" para confirmar que va contra la base real'
        required: true
        type: string

concurrency:
  group: migrate-d1
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Comprobar confirmación y archivo
        env:
          ARCHIVO: ${{ inputs.archivo }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "aplicar" ]; then
            echo "::error::Confirmación incorrecta. Escribe exactamente: aplicar"
            exit 1
          fi
          # Solo un nombre de archivo suelto: ni rutas ni subidas de directorio.
          case "$ARCHIVO" in
            */*|*..*) echo "::error::Indica solo el nombre del archivo, sin rutas."; exit 1 ;;
          esac
          if [ ! -f "drizzle/$ARCHIVO" ]; then
            echo "::error::drizzle/$ARCHIVO no existe en este commit."
            exit 1
          fi
          echo "Se aplicará drizzle/$ARCHIVO:"
          cat "drizzle/$ARCHIVO"

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migración en D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVO: ${{ inputs.archivo }}
        run: |
          npx wrangler d1 execute araya-centro-control-d1 \
            --remote \
            --file="drizzle/$ARCHIVO" \
            --config wrangler.deploy.jsonc
