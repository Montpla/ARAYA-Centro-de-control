name: Restaurar archivos retirados

# Restaura expedientes retirados (soft-delete) y recomputa los datos vivos.
# Simula por defecto; aplicar toca el panel.

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Parte del nombre del archivo a restaurar"
        required: true
        type: string
      aplicar:
        description: "Aplicar de verdad (1) o sólo simular (0)"
        required: false
        default: "0"
        type: string

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restaurar
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILTRO: ${{ inputs.filtro }}
          APLICAR: ${{ inputs.aplicar }}
        run: node scripts/restaurar.mjs
