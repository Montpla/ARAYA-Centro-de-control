name: Diagnóstico de actividad del .mpp

on:
  workflow_dispatch:
    inputs:
      fileId:
        required: true

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILE_ID: ${{ inputs.fileId }}
        run: node scripts/diag-mpp-actividad.mjs
