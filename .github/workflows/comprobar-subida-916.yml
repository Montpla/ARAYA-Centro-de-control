name: Comprobar subida de las 9:16

# Consulta de sólo lectura contra D1 remoto: estado de los archivos subidos
# hoy y su actividad/publicación asociada. Se retira tras la comprobación.

on:
  workflow_dispatch: {}

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Comprobar subida
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/comprobar-subida-916.mjs
