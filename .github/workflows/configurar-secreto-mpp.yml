name: Configurar el secreto GITHUB_ACTIONS_TOKEN en el Worker

# Herramienta de un solo uso: copia MPP_TRIGGER_TOKEN (secreto temporal del
# repositorio) al Worker de producción como GITHUB_ACTIONS_TOKEN, usando las
# credenciales de Cloudflare que ya existen para el despliegue normal. El
# valor nunca se imprime: wrangler lo recibe por stdin y GitHub enmascara
# cualquier secreto que aparezca en el log. Se retira tras usarse.

on:
  workflow_dispatch: {}

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Guardar el secreto en el Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MPP_TRIGGER_TOKEN: ${{ secrets.MPP_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MPP_TRIGGER_TOKEN:-}" ]; then
            echo "Falta el secreto del repositorio MPP_TRIGGER_TOKEN." >&2
            exit 1
          fi
          printf '%s' "$MPP_TRIGGER_TOKEN" | npx wrangler secret put GITHUB_ACTIONS_TOKEN --config wrangler.deploy.jsonc
      - name: Confirmar (sin mostrar el valor)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list --config wrangler.deploy.jsonc
