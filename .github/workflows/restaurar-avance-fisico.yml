name: Restaurar avance físico por edificio

# Devuelve el avance FÍSICO por edificio a su fuente de obra (Excel/informe),
# deshaciendo la sobrescritura que hizo el plan de Project. El % de cronograma
# del plan (projectSnapshot.scheduleProgress) no se toca. Simula por defecto.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Publicar de verdad (1) o sólo simular y comparar (0)"
        required: false
        default: "0"
        type: string

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restaurar avance físico
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          APLICAR: ${{ inputs.aplicar }}
        run: node scripts/restaurar-avance-fisico.mjs
