name: Ver último informe generado

# Sólo lectura: consulta en D1 los informes (report_snapshots) más recientes,
# para responder si el último informe generado se guardó correctamente.

on:
  workflow_dispatch: {}

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consultar último informe generado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ultimo-informe-generado.mjs
