name: Diagnóstico de MPP y sus XML derivados

# Herramienta puntual de solo lectura: lista los .mpp subidos y su XML
# convertido (si existe), con el recibo de publicación de cada uno. Se borra
# tras usarse, igual que el resto de scripts de diagnóstico de este repo.

on:
  workflow_dispatch: {}

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consultar
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/diagnostico-mpp.mjs
