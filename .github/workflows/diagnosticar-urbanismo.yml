name: Diagnosticar urbanismReportAreas

# Consulta de sólo lectura contra D1 remoto: vuelca las claves
# urbanismReportAreas* para diagnosticar por qué el panel de Urbanismo no
# refleja el 8% de Infraestructura eléctrica publicado en la revisión 100.

on:
  workflow_dispatch: {}

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Diagnosticar urbanismReportAreas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnosticar-urbanismo.mjs
