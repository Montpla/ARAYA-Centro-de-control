name: Alta directa de Francisco Celis

# Da de alta a Francisco Celis directamente en D1, saltando /api/admin/users
# (esa ruta convierte cualquier excepción del INSERT en el mensaje genérico
# "Ese correo ya está registrado.", y dos intentos reales por esa vía no
# permitieron distinguir un choque de correo real de otra causa). La lectura
# directa a la base, por tres vías distintas, confirmó que no existe ninguna
# fila con este correo. Autorizado explícitamente por el usuario.

on:
  workflow_dispatch: {}

jobs:
  alta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Alta directa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/alta-directa-francisco-celis.mjs
