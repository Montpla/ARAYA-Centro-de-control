name: Depurar Costo Ago-26.xlsx sin tabla reconocida

# "Costo Ago-26.xlsx" quedó reprocesado sin ninguna propuesta ("No se
# reconoció ninguna tabla de datos en la hoja"), aunque extractCostByCategory-
# Progress se verificó contra este mismo archivo real más temprano en esta
# sesión. Vuelca la estructura real de cada hoja para ver qué cambió. Se
# retira tras depurarlo.

on:
  workflow_dispatch: {}

jobs:
  depurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Depurar
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/depurar-costo-ago26.mjs
