name: Cerrar antecedente XLS de junio

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Registrar la sustitución (1) o sólo comprobarla (0)"
        required: true
        default: "0"
        type: string

jobs:
  cerrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Relacionar antecedente y fuente vigente
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          APLICAR: ${{ inputs.aplicar }}
        run: node scripts/cerrar-historico-junio.mjs

concurrency:
  group: cerrar-historico-junio
  cancel-in-progress: false
