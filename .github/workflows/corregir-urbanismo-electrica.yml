name: Corregir urbanismo Infraestructura eléctrica

# Corrección puntual de la revisión 100: el 8% de Infraestructura eléctrica se
# escribió en el índice equivocado (Instalaciones de gas) porque el array vivo
# tiene otro orden que el estático del código. Se elimina tras confirmarla.

on:
  workflow_dispatch: {}

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Corregir urbanismReportAreas
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/corregir-urbanismo-electrica.mjs
