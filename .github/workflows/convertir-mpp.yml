name: Convertir MPP a XML y leerlo

# Lee los .mpp binarios que no se pueden abrir dentro del Worker: el runner sí
# tiene Java, así que convierte el .mpp a XML de Project (MSPDI) con MPXJ y lo
# re-ingiere por el lector de Project que ya existe. Simula por defecto.

on:
  schedule:
    # GitHub ejecuta los cron en UTC. Cada cuarto de hora busca únicamente MPP
    # sin conversión; el script es idempotente y limita el lote.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      filtro:
        description: "Texto que debe contener el nombre del .mpp (p. ej. 30-07-2026)"
        required: false
        default: ""
        type: string
      aplicar:
        description: "Subir el XML convertido (1) o sólo convertir y validar (0)"
        required: false
        default: "0"
        type: string

jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: scripts/mpxj-pom.xml
      - name: Preparar MPXJ (classpath)
        run: |
          set -euo pipefail
          echo "MPXJ 13.12.0 · maven-dependency-plugin 3.11.0"
          rm -f /tmp/cp.txt
          for INTENTO in 1 2 3; do
            if mvn --batch-mode --no-transfer-progress -f scripts/mpxj-pom.xml \
              org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath \
              -Dmdep.outputFile=/tmp/cp.txt; then
              break
            fi
            if [ "$INTENTO" -eq 3 ]; then
              echo "No se pudo preparar MPXJ después de 3 intentos." >&2
              exit 1
            fi
            ESPERA=$((INTENTO * 15))
            echo "Maven no respondió; nuevo intento en ${ESPERA}s." >&2
            sleep "$ESPERA"
          done
          test -s /tmp/cp.txt
          echo "MPXJ_CP=$(cat /tmp/cp.txt)" >> "$GITHUB_ENV"
      - name: Convertir y (opcional) subir
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILTRO: ${{ inputs.filtro }}
          APLICAR: ${{ github.event_name == 'schedule' && '1' || inputs.aplicar }}
          MAX_POR_EJECUCION: "5"
        run: node scripts/convertir-mpp.mjs

concurrency:
  group: convertir-mpp-produccion
  cancel-in-progress: false
