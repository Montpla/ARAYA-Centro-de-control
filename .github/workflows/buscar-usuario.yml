name: Buscar usuario por correo

# Sólo lectura: consulta app_users por correo exacto para saber si existe
# una fila activa, archivada (eliminada) o ninguna. No expone el hash del PIN.

on:
  workflow_dispatch:
    inputs:
      correo:
        description: "Correo a buscar"
        required: true
        type: string

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Buscar usuario
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORREO: ${{ inputs.correo }}
        run: node scripts/buscar-usuario.mjs
