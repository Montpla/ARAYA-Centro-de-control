name: Diagnóstico previo a corrección de seguridad y costos

# Solo lectura: reúne lo que la IA propuso para la semana más reciente de
# seguridad (para corregir safetyMetrics con el dato real) y el catálogo
# completo de categorías de "Costo Ago-26.xlsx" (para diseñar el agrupador).
# Se retira tras el diagnóstico.

on:
  workflow_dispatch: {}

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Consultar propuestas y categorías
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/diagnostico-correccion-seguridad-costos.mjs
