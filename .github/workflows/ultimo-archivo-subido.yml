name: Ver último archivo subido

# Sólo lectura: consulta en D1 los archivos subidos más recientes y su estado
# real de procesamiento, para responder si la última subida se completó bien.

on:
  workflow_dispatch: {}

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consultar último archivo subido
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ultimo-archivo-subido.mjs
