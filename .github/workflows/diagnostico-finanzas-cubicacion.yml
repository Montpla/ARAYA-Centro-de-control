name: Diagnóstico de finanzas en cubicación de edificios

# La oficina dice que el Excel de cubicación de edificios también trae
# números de finanzas a nivel de edificio/apartamento. Diagnóstico de solo
# lectura: vuelca las hojas y cabeceras del archivo más reciente. Se retira
# tras el diagnóstico.

on:
  workflow_dispatch: {}

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Diagnosticar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/diagnostico-finanzas-cubicacion.mjs
