name: Corregir Movimiento de tierra

# Corrección puntual pedida por el usuario: restaura el 72,76% correcto de
# Movimiento de tierra (el reemplazo completo del array en la revisión 50 lo
# había dejado en 68%). Se elimina tras confirmarla.

on:
  workflow_dispatch: {}

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Corregir Movimiento de tierra
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/corregir-movimiento-tierra.mjs
