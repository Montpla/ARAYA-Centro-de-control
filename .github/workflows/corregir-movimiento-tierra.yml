name: Corregir Movimiento de tierra

# Segundo intento de la corrección puntual (la revisión 102 se descartó por
# no incluir cutoff). Se elimina tras confirmarla.

on:
  workflow_dispatch: {}

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Corregir Movimiento de tierra
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/corregir-movimiento-tierra.mjs
