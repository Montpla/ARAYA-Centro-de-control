name: Diagnóstico del reproceso de julio

# Muestra en qué estado quedaron los informes de julio tras el reproceso, sin
# imprimir ningún valor: sólo estado, resumen y nombres de clave.

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Texto que debe contener el nombre del archivo"
        required: false
        default: "jul"
        type: string

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnóstico
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILTRO: ${{ inputs.filtro }}
        run: node scripts/diagnostico-reproceso.mjs
