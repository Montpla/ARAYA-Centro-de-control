name: Diagnóstico de ingesta de un archivo

# Muestra en qué estado quedó la ingesta de un archivo -nombre y, si hace
# falta desambiguar, extensión-, sin imprimir ningún valor: sólo estado,
# resumen y nombres de clave de cada propuesta.

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Texto que debe contener el nombre del archivo"
        required: false
        default: "jul"
        type: string
      extension:
        description: "Extensión exacta a filtrar (vacío = cualquiera)"
        required: false
        default: ""
        type: string

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnóstico
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILTRO: ${{ inputs.filtro }}
          EXTENSION: ${{ inputs.extension }}
        run: node scripts/diagnostico-reproceso.mjs
