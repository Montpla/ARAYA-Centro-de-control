name: Diagnóstico de Costo Ago-26.xlsx

# "Costo Ago-26.xlsx" se subió y ningún lector reconoció su tabla (confianza
# 0.48). Descarga el original por la API real y vuelca solo su estructura
# (hojas, cabeceras, etiquetas de texto) para diagnosticar sin adivinar. Nunca
# imprime cifras. Se retira tras el diagnóstico.

on:
  workflow_dispatch: {}

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Diagnosticar estructura del archivo
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/diagnostico-costo-agosto.mjs
