name: Verificar checklist de septiembre

# Fuerza la reconciliación (GET /api/automation-center) y vuelca el estado de
# los requisitos de agosto y septiembre. Se retira tras la comprobación.

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verificar checklist
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/verificar-checklist-septiembre.mjs
