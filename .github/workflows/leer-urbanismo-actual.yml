name: Leer urbanismo actual

# Consulta de sólo lectura contra D1 remoto: por qué la corrección de
# Movimiento de tierra (revisión 102) no se refleja en el panel.

on:
  workflow_dispatch: {}

jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Leer urbanismReportAreas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/leer-urbanismo-actual.mjs
