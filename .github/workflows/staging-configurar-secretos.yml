name: Configurar secretos del Worker de staging

# Frente 4 del plan de fiabilidad. Configura, en el Worker de staging (nunca
# en el de producción), lo mínimo para poder entrar y probar de extremo a
# extremo:
#
#   - VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT: par de claves
#     propio de staging, generado aquí mismo (nunca el mismo que producción,
#     aunque tampoco importaría: la base de staging arranca sin
#     suscripciones push de nadie).
#   - BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PIN: se copian tal cual de los
#     secretos de repositorio STAGING_VERIFY_EMAIL / STAGING_VERIFY_PIN (hay
#     que crearlos antes, en Settings → Secrets → Actions; cualquier correo
#     y un PIN de 4 a 10 dígitos sirven, no hace falta que sean reales). El
#     primer login con ese correo y ese PIN crea el usuario administrador de
#     staging automáticamente (lib/access-control.ts, app/api/auth/login).
#
# DELIBERADAMENTE no configura GITHUB_ACTIONS_TOKEN ni OPENAI_API_KEY en
# staging:
#   - GITHUB_ACTIONS_TOKEN dispara workflows como "convertir-mpp" o
#     "reintentar-subida-diferida" contra la rama main y, a través de ellos,
#     contra RECURSOS DE PRODUCCIÓN (lib/mpp-conversion-trigger.ts,
#     lib/deferred-upload-retry-trigger.ts usan siempre ref: "main"). Una
#     subida de prueba en staging con ese secreto configurado dispararía
#     esos workflows contra la base real. El código ya contempla que no
#     exista (no hace nada si falta), así que staging se queda sin ese
#     disparo instantáneo — aceptable para pruebas.
#   - OPENAI_API_KEY habilita el respaldo por IA de la extracción; sin ella,
#     los lectores directos (Excel, XML de Project, PDF, ZIP) siguen
#     funcionando igual, que es donde han estado los incidentes reales de
#     esta sesión. Si hace falta probar también el respaldo de IA, hay que
#     añadir ese secreto a mano con "wrangler secret put OPENAI_API_KEY
#     --config wrangler.staging.jsonc" (no se automatiza aquí: sería
#     reutilizar la clave de producción en un segundo entorno).

on:
  workflow_dispatch: {}

concurrency:
  group: staging-configurar-secretos
  cancel-in-progress: false

jobs:
  configurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Comprobar que existen los secretos de arranque
        env:
          STAGING_VERIFY_EMAIL: ${{ secrets.STAGING_VERIFY_EMAIL }}
          STAGING_VERIFY_PIN: ${{ secrets.STAGING_VERIFY_PIN }}
        run: |
          if [ -z "$STAGING_VERIFY_EMAIL" ] || [ -z "$STAGING_VERIFY_PIN" ]; then
            echo "::error::Faltan los secretos de repositorio STAGING_VERIFY_EMAIL / STAGING_VERIFY_PIN. Añádelos en Settings -> Secrets and variables -> Actions y vuelve a lanzar este workflow."
            exit 1
          fi

      - name: Generar y guardar claves VAPID propias de staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node -e '
            const { webcrypto } = require("node:crypto");
            const b64url = (buf) => Buffer.from(buf).toString("base64")
              .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            (async () => {
              const pair = await webcrypto.subtle.generateKey(
                { name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"],
              );
              const pub = await webcrypto.subtle.exportKey("raw", pair.publicKey);
              const jwk = await webcrypto.subtle.exportKey("jwk", pair.privateKey);
              require("node:fs").writeFileSync(".vapid.json", JSON.stringify({
                publicKey: b64url(pub),
                privateKey: jwk.d,
              }));
            })();
          '
          PUBLIC_KEY="$(node -p 'require("./.vapid.json").publicKey')"
          PRIVATE_KEY="$(node -p 'require("./.vapid.json").privateKey')"
          rm -f .vapid.json
          echo "::add-mask::$PRIVATE_KEY"
          echo "::add-mask::$PUBLIC_KEY"
          printf '%s' "$PUBLIC_KEY" | npx wrangler secret put VAPID_PUBLIC_KEY --config wrangler.staging.jsonc
          printf '%s' "$PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY --config wrangler.staging.jsonc
          printf 'mailto:staging@araya.local' | npx wrangler secret put VAPID_SUBJECT --config wrangler.staging.jsonc

      - name: Copiar el arranque de administrador a staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_VERIFY_EMAIL: ${{ secrets.STAGING_VERIFY_EMAIL }}
          STAGING_VERIFY_PIN: ${{ secrets.STAGING_VERIFY_PIN }}
        run: |
          printf '%s' "$STAGING_VERIFY_EMAIL" | npx wrangler secret put BOOTSTRAP_ADMIN_EMAIL --config wrangler.staging.jsonc
          printf '%s' "$STAGING_VERIFY_PIN" | npx wrangler secret put BOOTSTRAP_ADMIN_PIN --config wrangler.staging.jsonc
          echo "Listo. Primer login en staging con ese correo y ese PIN crea el administrador."
