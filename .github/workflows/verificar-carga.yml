name: Verificar carga

# El Centro de Control lo lanza en cuanto se sube un archivo
# (lib/upload-verification-trigger.ts). Espera a que el archivo termine de
# procesarse y comprueba que entró bien: que se leyó y publicó, que no se
# descartaron datos por un motivo sospechoso, que la fecha de corte es
# coherente y que ningún avance retrocede sin explicación. Avisa a los
# administradores en el panel y en el móvil con el resultado.
#
# Si encuentra una anomalía, el segundo trabajo pone a Claude a revisarla con
# la suscripción del dueño (secreto CLAUDE_CODE_OAUTH_TOKEN), siguiendo
# .github/claude/arreglar-carga.md:
#   - fallo del programa → Claude lo corrige con su prueba en una rama y abre
#     un PR; este workflow repite typecheck y pruebas, fusiona, despliega,
#     reprocesa el archivo y vuelve a verificarlo, y avisa del resultado;
#   - caso dudoso → no toca nada y avisa con lo que hace falta decidir.
# Sin el secreto, sólo se avisa y queda el issue con el diagnóstico.

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "ID exacto del archivo (o un texto de su nombre, al lanzarlo a mano)"
        required: true
        type: string
      notificar:
        description: "Avisar con el resultado (1) o sólo comprobar (0)"
        required: false
        default: "1"
        type: string
      arreglar:
        description: "Si hay anomalía, que Claude intente arreglarla (1) o no (0)"
        required: false
        default: "1"
        type: string
      fusionar_pr:
        description: "Número de un PR de arreglo ya hecho por Claude para terminar su circuito (comprobar, fusionar, desplegar, reprocesar y avisar) sin volver a revisarlo"
        required: false
        default: ""
        type: string
      encargo:
        description: "Tarea concreta para Claude (opcional): se hace aunque la carga esté bien, con el mismo circuito de pruebas, fusión, despliegue, reproceso y aviso"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: verificar-carga-${{ inputs.file_id }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      veredicto: ${{ steps.verificacion.outputs.veredicto }}
      file_id: ${{ steps.verificacion.outputs.file_id }}
      nombre: ${{ steps.verificacion.outputs.nombre }}
      issue: ${{ steps.issue.outputs.numero }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Esperar al procesamiento y verificar
        id: verificacion
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILE_ID: ${{ inputs.file_id }}
          NOTIFICAR: ${{ inputs.notificar }}
          VERIFICACION_MD: ${{ runner.temp }}/verificacion.md
        run: node scripts/verificar-carga.mjs
      - name: Abrir issue si hay algo que arreglar
        id: issue
        if: ${{ steps.verificacion.outputs.veredicto == 'anomalia' && inputs.notificar != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOMBRE: ${{ steps.verificacion.outputs.nombre }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFICACION_MD: ${{ runner.temp }}/verificacion.md
        run: |
          set -euo pipefail
          TITLE="🔎 Revisar carga: ${NOMBRE}"
          BODY="$(cat "$VERIFICACION_MD")"$'\n\n'"Registro de la verificación: ${RUN_URL}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "numero=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY")
            echo "numero=${URL##*/}" >> "$GITHUB_OUTPUT"
          fi

  arreglar:
    needs: verificar
    if: ${{ (needs.verificar.outputs.veredicto == 'anomalia' || inputs.encargo != '' || inputs.fusionar_pr != '') && inputs.arreglar != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      FILE_ID: ${{ needs.verificar.outputs.file_id }}
      ISSUE: ${{ needs.verificar.outputs.issue }}
      DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
      DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
      RAMA: claude/arreglo-carga-${{ github.run_id }}
    steps:
      - name: Comprobar que hay token de Claude
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "hay=1" >> "$GITHUB_OUTPUT"; else
            echo "hay=0" >> "$GITHUB_OUTPUT"
            echo "Sin CLAUDE_CODE_OAUTH_TOKEN: la anomalía queda avisada y en el issue, sin arreglo automático."
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.token.outputs.hay == '1' }}
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: ${{ steps.token.outputs.hay == '1' }}
        with:
          node-version: "22"
      - name: Preparar el diagnóstico y la rama
        if: ${{ steps.token.outputs.hay == '1' }}
        env:
          NOTIFICAR: "0"
          ENCARGO: ${{ inputs.encargo }}
          VERIFICACION_MD: ${{ github.workspace }}/.verificacion/diagnostico.md
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mkdir -p .verificacion
          node scripts/verificar-carga.mjs
          if [ -n "$ENCARGO" ]; then
            printf '\n\n## Encargo\n\n%s\n' "$ENCARGO" >> .verificacion/diagnostico.md
          fi
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
      - name: Claude revisa y, si es un fallo del programa, lo corrige
        id: claude
        if: ${{ steps.token.outputs.hay == '1' && inputs.fusionar_pr == '' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Sigue al pie de la letra las instrucciones de `.github/claude/arreglar-carga.md`.
            Archivo afectado: ${{ needs.verificar.outputs.nombre }} (identificador ${{ needs.verificar.outputs.file_id }}).
            Diagnóstico de la verificación: `.verificacion/diagnostico.md`.
            Trabaja en la rama `${{ env.RAMA }}` (ya creada y activa). Repositorio: ${{ github.repository }}.
            Termina siempre escribiendo `.verificacion/decision.json`.
          claude_args: >-
            --max-turns 80
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(gh pr:*),Bash(curl:*),Bash(jq:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
      - name: Leer la decisión
        id: decision
        if: ${{ always() && steps.token.outputs.hay == '1' }}
        env:
          FUSIONAR_PR: ${{ inputs.fusionar_pr }}
        run: |
          if [ -n "$FUSIONAR_PR" ]; then
            echo "accion=arreglado" >> "$GITHUB_OUTPUT"
            echo "pr=$FUSIONAR_PR" >> "$GITHUB_OUTPUT"
            echo "resumen=$(gh pr view "$FUSIONAR_PR" --json title -q .title | cut -c1-300)" >> "$GITHUB_OUTPUT"
          elif [ -f .verificacion/decision.json ]; then
            echo "accion=$(jq -r '.accion // "sin_decision"' .verificacion/decision.json)" >> "$GITHUB_OUTPUT"
            echo "pr=$(jq -r '.pr // ""' .verificacion/decision.json)" >> "$GITHUB_OUTPUT"
            echo "resumen=$(jq -r '.resumen // ""' .verificacion/decision.json | tr '\n' ' ' | cut -c1-1500)" >> "$GITHUB_OUTPUT"
          else
            echo "accion=sin_decision" >> "$GITHUB_OUTPUT"
            echo "resumen=La revisión automática no terminó (posible límite de uso de la suscripción o error)." >> "$GITHUB_OUTPUT"
          fi
      - name: Comprobar, fusionar, desplegar y reprocesar
        id: fusion
        if: ${{ steps.decision.outputs.accion == 'arreglado' }}
        env:
          PR: ${{ steps.decision.outputs.pr }}
          RESUMEN: ${{ steps.decision.outputs.resumen }}
        run: |
          set -euo pipefail
          git fetch origin main
          # Si Claude no pudo abrir el PR (GitHub no deja que los workflows los
          # creen salvo que se active en Settings → Actions), se intenta aquí.
          if [ -z "$PR" ] && git ls-remote --exit-code origin "refs/heads/$RAMA" >/dev/null; then
            PR=$(gh pr create --base main --head "$RAMA" --title "Arreglo automático de la carga $FILE_ID" \
              --body "$RESUMEN"$'\n\n'"Registro: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>/dev/null \
              | grep -oE '[0-9]+$' || true)
          fi
          if [ -n "$PR" ]; then
            # Comprobación independiente de la de Claude, sobre lo que hay en el PR.
            gh pr checkout "$PR"
            npm ci --no-audit --no-fund
            # Lo mismo que la CI: typecheck, compilación y pruebas (algunas
            # pruebas revisan el código compilado de la web).
            npm test
            gh pr ready "$PR" || true
            # main exige que la CI pase en el PR, y un PR abierto desde un
            # workflow no la lanza solo: se lanza sobre su rama y se espera.
            CABEZA=$(gh pr view "$PR" --json headRefName,headRefOid -q '.headRefName + " " + .headRefOid')
            RAMA_PR=${CABEZA% *}; SHA_PR=${CABEZA#* }
            gh workflow run ci.yml --ref "$RAMA_PR"
            CI_OK=0
            for i in $(seq 1 60); do
              sleep 20
              CI=$(gh run list --workflow ci.yml --branch "$RAMA_PR" --limit 5 --json headSha,status,conclusion \
                --jq "[.[] | select(.headSha == \"$SHA_PR\")][0] // empty")
              [ -z "$CI" ] && continue
              [ "$(echo "$CI" | jq -r .status)" != "completed" ] && continue
              if [ "$(echo "$CI" | jq -r .conclusion)" = "success" ]; then CI_OK=1; fi
              break
            done
            if [ "$CI_OK" != "1" ]; then echo "La CI del PR #$PR no terminó en verde"; exit 1; fi
            gh pr merge "$PR" --squash --delete-branch
            echo "como=el PR #$PR" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code origin "refs/heads/$RAMA" >/dev/null; then
            # Sin permiso para PR: misma comprobación y fusión directa en main.
            git fetch origin "$RAMA"
            git checkout -B fusion-automatica origin/main
            git merge --squash "origin/$RAMA"
            npm ci --no-audit --no-fund
            # Lo mismo que la CI: typecheck, compilación y pruebas (algunas
            # pruebas revisan el código compilado de la web).
            npm test
            git commit -m "Arreglo automático de la carga $FILE_ID"$'\n\n'"$RESUMEN"$'\n\n'"Rama: $RAMA"
            git push origin HEAD:main
            git push origin --delete "$RAMA" || true
            echo "como=la rama $RAMA fusionada directamente en main ($(git rev-parse --short HEAD))" >> "$GITHUB_OUTPUT"
          else
            echo "Claude marcó el arreglo pero no subió ninguna rama."; exit 1
          fi
          # Una fusión hecha con el token del workflow no dispara deploy.yml por
          # sí sola: se lanza a mano y se espera a que termine bien.
          INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref main
          DESPLEGADO=0
          for i in $(seq 1 60); do
            sleep 20
            RUN=$(gh run list --workflow deploy.yml --limit 5 --json databaseId,createdAt,status,conclusion \
              --jq "[.[] | select(.createdAt >= \"$INICIO\")][0] // empty")
            [ -z "$RUN" ] && continue
            [ "$(echo "$RUN" | jq -r .status)" != "completed" ] && continue
            if [ "$(echo "$RUN" | jq -r .conclusion)" = "success" ]; then DESPLEGADO=1; fi
            break
          done
          if [ "$DESPLEGADO" != "1" ]; then echo "El despliegue no terminó bien"; exit 1; fi
          FILTRO="" APLICAR=1 node scripts/reprocesar.mjs
      - name: Avisar del resultado
        if: ${{ always() && steps.token.outputs.hay == '1' }}
        env:
          ACCION: ${{ steps.decision.outputs.accion }}
          PR: ${{ steps.decision.outputs.pr }}
          RESUMEN: ${{ steps.decision.outputs.resumen }}
          FUSION: ${{ steps.fusion.outcome }}
          COMO: ${{ steps.fusion.outputs.como }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFICACION_MD: ${{ runner.temp }}/final.md
        run: |
          set -uo pipefail
          case "$ACCION" in
            arreglado)
              if [ "$FUSION" = "success" ]; then NOTA="Claude lo ha arreglado ($COMO), desplegado y la carga se ha reprocesado: $RESUMEN"
              else NOTA="Claude propuso un arreglo pero no pasó las comprobaciones, la fusión o el despliegue; queda sin fusionar en la rama $RAMA: $RESUMEN"; fi ;;
            dudoso) NOTA="Claude lo ha revisado y necesita tu decisión: $RESUMEN" ;;
            sin_accion) NOTA="Claude lo ha revisado y la carga está bien: $RESUMEN" ;;
            *) NOTA="$RESUMEN" ;;
          esac
          # Un arreglo subido a la rama sin marcarse como tal no debe perderse.
          if [ "$ACCION" != "arreglado" ] && git ls-remote --exit-code origin "refs/heads/$RAMA" >/dev/null 2>&1; then
            NOTA="$NOTA Hay un arreglo propuesto en la rama $RAMA pendiente de revisar."
          fi
          sleep 60
          NOTIFICAR=1 NOTA="$NOTA" node scripts/verificar-carga.mjs || true
          if [ -n "${ISSUE:-}" ]; then
            gh issue comment "$ISSUE" --body "$NOTA"$'\n\n'"$(cat "$VERIFICACION_MD" 2>/dev/null)"$'\n\n'"Registro: $RUN_URL"
            if [ "$ACCION" = "sin_accion" ] || { [ "$ACCION" = "arreglado" ] && [ "$FUSION" = "success" ]; }; then
              gh issue close "$ISSUE" --reason completed || true
            fi
          fi
