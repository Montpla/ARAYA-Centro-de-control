name: Comprobar archivos recientes

# Consulta puntual, solo lectura: confirma que todo lo subido en las
# últimas 48 horas quedó procesado e integrado. Se retira tras la
# comprobación.

on:
  workflow_dispatch: {}

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Comprobar archivos recientes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/comprobar-archivos-recientes.mjs
