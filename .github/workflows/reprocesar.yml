name: Reprocesar archivos con el pipeline actual

# Vuelve a pasar por la ingesta los archivos ya subidos, para que recojan las
# mejoras de los lectores. Simula por defecto; aplicar publica en el panel.

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Texto que debe contener el nombre del archivo (p. ej. jul)"
        required: false
        default: "jul"
        type: string
      formatos:
        description: "Restringir por extensión (p. ej. pptx o pptx,docx). Vacío = todos"
        required: false
        default: ""
        type: string
      reemplazar:
        description: "Retirar el expediente previo y re-ingerir como alta nueva (1) en vez de re-publicar encima (0)"
        required: false
        default: "0"
        type: string
      aplicar:
        description: "Aplicar de verdad (1) o sólo simular (0)"
        required: false
        default: "0"
        type: string
      debug:
        description: "Mostrar el detalle del error si la publicación no se confirma (1)"
        required: false
        default: "0"
        type: string

jobs:
  reprocesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reprocesar
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILTRO: ${{ inputs.filtro }}
          FORMATOS: ${{ inputs.formatos }}
          REEMPLAZAR: ${{ inputs.reemplazar }}
          APLICAR: ${{ inputs.aplicar }}
          DEBUG: ${{ inputs.debug }}
        run: node scripts/reprocesar.mjs
