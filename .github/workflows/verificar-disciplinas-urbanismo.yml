name: Verificar disciplinas de urbanismo automáticas

# Verificación puntual (se retira tras confirmarla): descarga de producción
# el .mpp real de Fase I, lo convierte de nuevo con MPXJ y sube el XML
# exactamente como lo haría convertir-mpp.mjs, para confirmar que la
# extracción automática de disciplinas de urbanismo (PR #152) funciona sin
# intervención manual.

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: scripts/mpxj-pom.xml
      - name: Preparar MPXJ (classpath)
        run: |
          set -euo pipefail
          rm -f /tmp/cp.txt
          for INTENTO in 1 2 3; do
            if mvn --batch-mode --no-transfer-progress -f scripts/mpxj-pom.xml \
              org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath \
              -Dmdep.outputFile=/tmp/cp.txt; then
              break
            fi
            if [ "$INTENTO" -eq 3 ]; then
              echo "No se pudo preparar MPXJ después de 3 intentos." >&2
              exit 1
            fi
            ESPERA=$((INTENTO * 15))
            echo "Maven no respondió; nuevo intento en ${ESPERA}s." >&2
            sleep "$ESPERA"
          done
          test -s /tmp/cp.txt
          echo "MPXJ_CP=$(cat /tmp/cp.txt)" >> "$GITHUB_ENV"
      - name: Descargar, convertir y subir
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          MPP_FILE_ID: "5f1440d9-e29a-4c2c-be22-f04dbc72607f"
        run: node scripts/verificar-disciplinas-urbanismo.mjs
