name: Ver contenido de una sección descubierta

# Vuelca, sólo lectura, el contenido de las secciones descubiertas (bloques
# que la lectura documental encontró sin campo propio en el modelo y que ya
# se publicaron solos en el panel). No es contenido financiero, así que se
# imprime completo.

on:
  workflow_dispatch:
    inputs:
      fragmento:
        description: "Texto que debe contener el título de la sección (vacío = todas)"
        required: false
        default: ""
        type: string

jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ver sección descubierta
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FRAGMENTO: ${{ inputs.fragmento }}
        run: node scripts/ver-seccion-descubierta.mjs
