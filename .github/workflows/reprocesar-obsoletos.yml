name: Reprocesar archivos con lector nuevo

on:
  schedule:
    # Lotes pequeños cada seis horas: evita picos y termina solo cuando todos
    # los expedientes conservan la versión vigente del pipeline.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      filtro:
        description: "Texto opcional en el nombre del expediente"
        required: false
        default: ""
        type: string
      aplicar:
        description: "Reprocesar (1) o sólo enumerar candidatos (0)"
        required: false
        default: "0"
        type: string

jobs:
  reprocesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Releer expedientes obsoletos
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILTRO: ${{ inputs.filtro }}
          APLICAR: ${{ github.event_name == 'schedule' && '1' || inputs.aplicar }}
          MAX_POR_EJECUCION: "3"
        run: node scripts/reprocesar-obsoletos.mjs

concurrency:
  group: reprocesar-archivos-produccion
  cancel-in-progress: false
