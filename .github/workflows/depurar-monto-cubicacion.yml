name: Depurar el monto certificado de la cubicación

# verificar-monto-cubicacion.mjs muestra que cubicacionCaratula sigue sin
# publicarse tras mover extractCubicacionMontoResumen al frente del
# despachador. Llama al lector directamente sobre los bytes reales, sin
# pasar por el resto del pipeline de subida. Se retira tras depurarlo.

on:
  workflow_dispatch: {}

jobs:
  depurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Depurar
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
        run: node scripts/depurar-monto-cubicacion.mjs
