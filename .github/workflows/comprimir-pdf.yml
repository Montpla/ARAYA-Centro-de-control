name: Comprimir PDF grandes y leerlos

# Los PDF de más de 15 MB (reportes de fotos escaneadas) no caben en la memoria
# del Worker. Aquí se comprimen con Ghostscript y la versión ligera se sube como
# archivo derivado, que se lee por la ingesta de siempre. La app lo dispara al
# recibir un PDF grande; el cron es la red de seguridad. Simula por defecto en
# ejecución manual.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      file_id:
        description: "ID exacto del expediente (vacío = todos los PDF grandes pendientes)"
        required: false
        default: ""
        type: string
      aplicar:
        description: "Subir el PDF comprimido (1) o sólo comprimir y medir (0)"
        required: false
        default: "0"
        type: string

permissions:
  issues: write

jobs:
  comprimir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instalar Ghostscript
        run: command -v gs || (sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript)
      - name: Comprimir y (opcional) subir
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          FILE_ID: ${{ inputs.file_id }}
          APLICAR: ${{ github.event_name == 'schedule' && '1' || inputs.aplicar }}
        run: node scripts/comprimir-pdf.mjs
      - name: Avisar si falló
        if: failure()
        uses: ./.github/actions/avisar-fallo-cron
        with:
          workflow-name: "Comprimir PDF grandes y leerlos"

concurrency:
  group: comprimir-pdf-produccion
  cancel-in-progress: false
