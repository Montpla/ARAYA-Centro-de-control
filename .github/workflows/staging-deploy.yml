name: Desplegar a staging

# Frente 4 del plan de fiabilidad: despliega la rama actual al Worker de
# staging (araya-centro-control-staging), completamente separado de
# producción, para poder probar cambios de lógica de ingesta/clasificación
# de extremo a extremo (subida real → clasificación → extracción →
# publicación → notificación) antes de fusionarlos a main.
#
# A mano, desde cualquier rama: normalmente se dispara desde la rama del PR
# que se quiere probar, justo antes de fusionar.
#
# Requiere que wrangler.staging.jsonc ya tenga el database_id real (lo
# imprime "Provisionar entorno de staging" la primera vez).

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck y build
        run: |
          npx tsc --noEmit -p .
          npm run build
      - name: Desplegar a Cloudflare Workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc
