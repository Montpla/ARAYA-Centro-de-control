name: Adaptar propuestas pendientes

# Recupera las propuestas de sección nueva que se quedaron esperando antes de
# que los bloques descubiertos empezaran a publicarse solos.
#
# Por defecto simula: enseña qué haría sin tocar nada. Hay que pedir aplicar
# expresamente, porque publica en el panel que ve toda la oficina.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar de verdad (1) o sólo simular (0)"
        required: false
        default: "0"
        type: string

jobs:
  adaptar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Adaptar propuestas
        env:
          DEPLOY_VERIFY_EMAIL: ${{ secrets.DEPLOY_VERIFY_EMAIL }}
          DEPLOY_VERIFY_PIN: ${{ secrets.DEPLOY_VERIFY_PIN }}
          APLICAR: ${{ inputs.aplicar }}
        run: node scripts/adaptar-propuestas.mjs
