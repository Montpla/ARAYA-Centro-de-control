name: Corregir corte del cronograma de septiembre

# Corrección puntual: el usuario confirmó que el cronograma subido con corte
# 30-08-2026 en el nombre es en realidad el vigente de septiembre. Ajusta su
# fecha de corte a hoy para que se cuente en el periodo correcto. No toca
# ninguna cifra ni evento publicado. Se retira tras confirmarla.

on:
  workflow_dispatch: {}

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Corregir corte
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/corregir-corte-cronograma.mjs
