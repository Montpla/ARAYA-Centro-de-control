name: Diagnóstico de edificios y avances

# Consulta puntual, solo lectura: la oficina reporta que "los colores cambian
# pero los porcentajes no" en el avance de edificios. Vuelca el valor,
# revisión y fecha de cada buildings.*.progress, y los últimos archivos de
# obra/planificación, para diagnosticar sin suponer. Se retira tras el
# diagnóstico.

on:
  workflow_dispatch: {}

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Consultar edificios y archivos recientes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnostico-edificios.mjs
