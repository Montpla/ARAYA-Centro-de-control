name: Corregir sección descubierta fantasma y publicar Tema Semana Nº4

# Aplica, y sólo aplica, scripts/corregir-descubiertas-y-tema-semana4-2026-08-24.sql
# contra D1 remoto. No es un runner genérico: este workflow ejecuta
# exclusivamente ese archivo, para un único fin puntual y auditado —
# eliminar la fila raíz "discoveredSections" obsoleta que tapaba secciones
# ya publicadas, y publicar el "Tema" pendiente de la Semana Nº4 de
# Seguridad. No cambia ninguna cifra existente del Centro de Control.
#
# Nunca se dispara solo. Requiere escribir "aplicar" para confirmar que va
# contra la base real. Reutiliza los secretos que ya usa deploy.yml.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe "aplicar" para confirmar que va contra la base real'
        required: true
        type: string

concurrency:
  group: corregir-descubiertas-tema-semana4
  cancel-in-progress: false

jobs:
  corregir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Comprobar confirmación
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "aplicar" ]; then
            echo "::error::Confirmación incorrecta. Escribe exactamente: aplicar"
            exit 1
          fi
          echo "Se aplicará scripts/corregir-descubiertas-y-tema-semana4-2026-08-24.sql:"
          cat "scripts/corregir-descubiertas-y-tema-semana4-2026-08-24.sql"

      - run: npm ci

      - name: Aplicar script en D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute araya-centro-control-d1 \
            --remote \
            --file="scripts/corregir-descubiertas-y-tema-semana4-2026-08-24.sql" \
            --config wrangler.deploy.jsonc
